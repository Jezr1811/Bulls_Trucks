{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card border-danger shadow-lg mx-auto" style="max-width: 500px; border-radius: 18px;">
        <div class="card-header bg-danger text-white text-center py-3" style="border-radius: 18px 18px 0 0;">
            <h4 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> ¿Confirmar Eliminación?</h4>
        </div>
        <div class="card-body text-center p-4">
            <p class="fs-5 mb-4">¿Estás seguro de que deseas eliminar este gasto? Esta acción no se puede deshacer.</p>
            
            <div class="alert alert-secondary text-start mb-4">
                <strong>Tipo:</strong> {{ gasto.get_tipo_display }}<br>
                <strong>Valor:</strong> ${{ gasto.valor }}<br>
                <strong>Viaje asociado:</strong> {{ gasto.viaje }}
            </div>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4 me-2">
                    <i class="bi bi-trash"></i> Sí, eliminar
                </button>
                <a href="{% url 'viajes:detalle_viaje' gasto.viaje.id %}" class="btn btn-secondary px-4">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
