{% extends "base.html" %}

{% block title %}
Eliminar Mantenimiento
{% endblock %}

{% block content %}

<h1>Eliminar Mantenimiento</h1>

<p>
    ¿Está seguro de eliminar el mantenimiento
    <strong>{{ mantenimiento.nombre_mantenimiento }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Sí, eliminar
    </button>

    <a href="{% url 'mantenimientos:lista_mantenimientos' %}">
        Cancelar
    </a>

</form>

{% endblock %}
